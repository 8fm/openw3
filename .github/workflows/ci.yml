name: CI

on: [push, pull_request]

jobs:
  windows-sln:
    name: Windows sln ${{ matrix.Configuration }} ${{ matrix.Platform }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        Configuration: [Debug, Profiling, Final]
        Platform: [x64]
    steps:
    - uses: actions/checkout@main
      with:
        submodules: recursive

    - name: Get Windows libs
      shell: cmd
      run: |
        curl -LJO https://github.com/open-w3/openw3-deps/releases/download/1.60-dev3/openw3-libs3-windows-Final-Debug-x64.7z
        7z x openw3-libs3-windows-Final-Debug-x64.7z
        dir bin

    - uses: microsoft/setup-msbuild@main
    - name: Build
      working-directory: dev/src
      run: msbuild /m /p:Configuration="${{ matrix.Configuration }}" /p:Platform="${{ matrix.Platform }}" LavaEngineVS2022.sln

    - name: Prepare artifacts
      shell: cmd
      run: dir bin\${{ matrix.Platform }} && copy bin\${{ matrix.Platform }}\*.exe bin\upload
    - name: Upload artifacts
      uses: actions/upload-artifact@main
      with:
        name: Witcher3.${{ matrix.Configuration }}.${{ matrix.Platform }}.sln.ci-${{ github.run_number }}
        path: bin\upload

  windows-cmake:
    name: Windows cmake ${{ matrix.Configuration }} ${{ matrix.Platform }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        Configuration: [Debug, Final]
        Platform: [x64]
    steps:
    - uses: actions/checkout@main
      with:
        submodules: recursive

    - name: Get Windows libs
      shell: cmd
      run: |
        curl -LJO https://github.com/open-w3/openw3-deps/releases/download/1.60-dev3/openw3-libs3-windows-Final-Debug-x64.7z
        7z x openw3-libs3-windows-Final-Debug-x64.7z
        dir bin

    - uses: ilammy/msvc-dev-cmd@v1
    - name: Build
      run: |
        cmake --preset=Windows-${{ matrix.Configuration }}
        cmake --build build/Windows-${{ matrix.Configuration }}

    - name: Prepare artifacts
      shell: cmd
      run: dir bin\${{ matrix.Platform }} && copy bin\${{ matrix.Platform }}\*.exe bin\upload
    - name: Upload artifacts
      uses: actions/upload-artifact@main
      with:
        name: Witcher3.${{ matrix.Configuration }}.${{ matrix.Platform }}.cmake.ci-${{ github.run_number }}
        path: bin\upload

  linux-cmake:
    name: Linux cmake ${{ matrix.Configuration }} ${{ matrix.os.Platform }}
    strategy:
      fail-fast: false
      matrix:
        Configuration: [Debug, Final]
        os:
          - Platform: x64
            CI: ubuntu-24.04
    runs-on: ${{ matrix.os.CI }}
    steps:
    - uses: actions/checkout@main
      with:
        submodules: recursive

    - name: Install libs
      run: |
        curl -LJO https://github.com/open-w3/openw3-deps/releases/download/1.60-dev3/openw3-libs3-windows-Final-Debug-x64.7z
        7z x openw3-libs3-windows-Final-Debug-x64.7z
        sudo apt-get update && sudo apt-get install libsdl2-dev libpulse-dev libvulkan-dev glslang-tools libomp-dev clang meson ninja-build libjson-perl spirv-headers
        vcpkg install directxmath directxtex
    - name: Build
      run: |
        export VCPKG_ROOT=/usr/local/share/vcpkg
        export CC=clang && export CXX=clang++
        ${CXX} --version && cmake --version
        cmake --preset=Linux-${{ matrix.Configuration }}
        cmake --build build/Linux-${{ matrix.Configuration }}
